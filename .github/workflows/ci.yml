name: CI — Typecheck, Lint, Tests & Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript, ESLint, Vitest, Expo Config & Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install mobile dependencies
        run: npm ci

      - name: Run TypeScript typecheck (mobile)
        run: npx tsc --noEmit

      - name: Run ESLint & React Compiler check
        run: npx expo lint

      - name: Run Vitest unit tests
        run: npm test

      - name: Verify Expo public config
        run: npx expo config --type public > /dev/null

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Verify website & BFF API build
        working-directory: website
        run: npm run build
