name: Android Production Release (.aab & .apk)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Signed AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Prepare public env config
        run: |
          if [ ! -f .env.local ]; then
            cp .env.example .env.local
          fi

      - name: Decode Android Upload Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/riftdaily-upload.p12"
            echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/riftdaily-upload.p12" >> "$GITHUB_ENV"
          fi

      - name: Generate Android project (Expo Prebuild CNG)
        run: npx expo prebuild --platform android --clean

      - name: Build signed Release AAB & APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease assembleRelease --parallel --no-daemon

      - name: Prepare release artifacts & changelog notes
        id: prep
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          mkdir -p build-artifacts
          cp android/app/build/outputs/bundle/release/app-release.aab "build-artifacts/RiftDaily-${TAG}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "build-artifacts/RiftDaily-${TAG}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "build-artifacts/RiftDaily.apk"

          # Extract section for this tag from CHANGELOG.md (fallback to latest section)
          node -e '
            const fs = require("fs");
            const tag = process.argv[1];
            const md = fs.readFileSync("CHANGELOG.md", "utf8");
            const escaped = tag.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const re = new RegExp(`## \\[${escaped}\\][^\\n]*\\n([\\s\\S]*?)(?=\\n## \\[|$)`);
            const m = md.match(re) || md.match(/## \[[^\]]+\][^\n]*\n([\s\S]*?)(?=\n## \[|$)/);
            const notes = m ? m[1].trim() : `Wydanie ${tag} aplikacji Rift Daily.`;
            fs.writeFileSync("build-artifacts/release-notes.md", notes + "\n");
          ' "${TAG}"

      - name: Check Google Play Service Account availability
        id: play_check
        env:
          PLAY_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "${PLAY_KEY}" ]; then
            echo "has_play_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_play_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload AAB & APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RiftDaily-Android-${{ steps.prep.outputs.tag }}
          path: |
            build-artifacts/RiftDaily-*.aab
            build-artifacts/RiftDaily-*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: Rift Daily ${{ steps.prep.outputs.tag }}
          body_path: build-artifacts/release-notes.md
          draft: false
          prerelease: false
          files: |
            build-artifacts/RiftDaily-*.aab
            build-artifacts/RiftDaily-*.apk
            build-artifacts/RiftDaily.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AAB to Google Play (Internal Track)
        if: steps.play_check.outputs.has_play_key == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: pl.matique.riftdaily
          releaseFiles: build-artifacts/RiftDaily-*.aab
          track: internal
          status: completed
