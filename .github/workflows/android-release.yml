name: Build & Release Android APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Wersja wydania (np. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Tytuł wydania'
        required: false
        default: 'Rift Daily v1.0.0 (Android APK)'
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Klonowanie repozytorium
        uses: actions/checkout@v4

      - name: ☕ Konfiguracja JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🟢 Konfiguracja Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalacja zależności npm
        run: npm ci

      - name: ⚙️ Przygotowanie pliku środowiskowego (.env.local)
        run: |
          if [ ! -f .env.local ]; then
            cp .env.example .env.local
          fi

      - name: 📱 Generowanie natywnego projektu Android (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 🔑 Uprawnienia dla Gradle wrapper
        run: chmod +x android/gradlew

      - name: 🔨 Budowanie pliku Release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: 🗂️ Przygotowanie artefaktów wydania
        id: prep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            APP_VER=$(node -p "require('./package.json').version")
            TAG="v${APP_VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk build-artifacts/RiftDaily.apk
          cp android/app/build/outputs/apk/release/app-release.apk build-artifacts/RiftDaily-${TAG}.apk
          ls -la build-artifacts

      - name: 📤 Zapisanie artefaktu APK w Actions
        uses: actions/upload-artifact@v4
        with:
          name: RiftDaily-Android-APK
          path: build-artifacts/RiftDaily.apk

      - name: 🚀 Publikacja w GitHub Releases
        if: steps.prep.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: ${{ github.event.inputs.release_title || steps.prep.outputs.tag }}
          body: |
            ### 📱 Rift Daily — Oficjalne Wydanie na Androida (.APK)

            Pobierz gotowy plik instalacyjny **Rift Daily** na swój telefon z systemem Android:
            - 🚀 **[Pobierz RiftDaily.apk](https://github.com/matiqueue/rift-daily/releases/download/${{ steps.prep.outputs.tag }}/RiftDaily.apk)**
            - 📦 Plik z wersją: `RiftDaily-${{ steps.prep.outputs.tag }}.apk`

            ---

            #### 💡 Jak zainstalować na telefonie z Androidem:
            1. Pobierz plik `RiftDaily.apk` bezpośrednio na swój telefon z linku powyżej.
            2. Po zakończeniu pobierania kliknij powiadomienie lub otwórz plik z folderu **Pobrane (Downloads)**.
            3. Jeśli system Android zapyta o zgodę na instalację z tego źródła (przeglądarki), wybierz **Ustawienia** i włącz **Zezwalaj z tego źródła**.
            4. Kliknij **Zainstaluj** i ciesz się nowoczesnym e-Dziennikiem USOS bez żadnych reklam i opłat!

            ---

            *Kompilacja wygenerowana w 100% z otwartego kodu źródłowego na maszynie GitHub Actions.*
          draft: false
          prerelease: false
          files: |
            build-artifacts/RiftDaily.apk
            build-artifacts/RiftDaily-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
