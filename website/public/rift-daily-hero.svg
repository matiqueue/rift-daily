<svg width="960" height="220" viewBox="0 0 960 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="50%" stop-color="#121216" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#FAFAFA" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1F1F24" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="960" height="220" rx="24" fill="url(#bg)" stroke="#27272A" stroke-width="2"/>
  <rect width="960" height="220" rx="24" fill="url(#grid)" opacity="0.55"/>

  <!-- Animated Rift Slash Line -->
  <line x1="60" y1="210" x2="210" y2="10" stroke="url(#accent)" stroke-width="3" stroke-linecap="round">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="3.2s" repeatCount="indefinite"/>
  </line>

  <!-- Glowing Status Dot -->
  <circle cx="258" cy="64" r="5" fill="#10B981">
    <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.45;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <text x="272" y="68" fill="#818CF8" font-family="Menlo, monospace" font-size="12" font-weight="800" letter-spacing="2">
    RIFT DAILY // OPEN-SOURCE USOS E-DZIENNIK FOR iOS &amp; ANDROID
  </text>

  <text x="252" y="122" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="46" font-weight="900" letter-spacing="-1.5">
    Rift Daily
  </text>

  <text x="254" y="156" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="16" font-weight="500">
    Linear / Vercel Bento UI • Live OAuth 1.0a USOS API • Face ID &amp; PIN • Dark &amp; Light Mode
  </text>

  <!-- Animated Metric Pills -->
  <g transform="translate(254, 172)">
    <rect x="0" y="0" width="118" height="26" rx="8" fill="#18181B" stroke="#27272A"/>
    <text x="14" y="17" fill="#10B981" font-family="Menlo, monospace" font-size="11" font-weight="800">GPA 4.78 ↑</text>

    <rect x="128" y="0" width="136" height="26" rx="8" fill="#18181B" stroke="#27272A"/>
    <text x="142" y="17" fill="#818CF8" font-family="Menlo, monospace" font-size="11" font-weight="800">FACE ID + PIN</text>

    <rect x="274" y="0" width="154" height="26" rx="8" fill="#18181B" stroke="#27272A"/>
    <text x="288" y="17" fill="#FAFAFA" font-family="Menlo, monospace" font-size="11" font-weight="800">40+ UCZELNI PL</text>
  </g>
</svg>
